spring:
  application:
    name: gateway-edge
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  # 토큰 상태 읽기 (GW-07, user-ms가 쓴 auth:blacklist·auth:revoked-at). 장애 시 보호 요청이 이 시간만큼 늦어지므로 짧게
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:500ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
  cloud:
    gateway:
      server:
        webflux:
          # 하위 서비스 연결·응답 타임아웃 (GW-09, SYS-13 3.2). 응답 초과 → 504 SERVICE_TIMEOUT, 연결 실패 → 503 SERVICE_UNAVAILABLE
          # 하위 서비스 보호는 타임아웃만 쓴다. Circuit Breaker·Retry 필터는 두지 않는다 (C03)
          # 원칙: 바깥 > 안쪽 호출 시간 합. 같은 네트워크라 연결은 즉시 되므로 2초면 서비스가 없는 것
          httpclient:
            connect-timeout: ${GW_CONNECT_TIMEOUT_MS:2000}
            response-timeout: ${GW_RESPONSE_TIMEOUT:5s}
          routes:
            - id: user-ms
              uri: lb://user-ms
              predicates:
                - Path=/api/v1/auth/**, /api/v1/users/**
            - id: company-ms
              uri: lb://company-ms
              predicates:
                - Path=/api/v1/companies/**, /api/v1/products/**
            - id: hub-ms
              uri: lb://hub-ms
              predicates:
                - Path=/api/v1/hubs/**, /api/v1/hub-routes/**, /api/v1/inventories/**
            - id: order-ms
              uri: lb://order-ms
              predicates:
                - Path=/api/v1/orders/**
              # 주문 생성은 Hub(재고)·Delivery(배송 생성)를 차례로 Feign 호출한다 (연결 1초 + 읽기 2초씩, C02).
              # 라우트 metadata 단위는 밀리초 숫자다 (전역 response-timeout은 Duration)
              metadata:
                response-timeout: ${GW_ORDER_RESPONSE_TIMEOUT_MS:15000}
            - id: delivery-ms
              uri: lb://delivery-ms
              predicates:
                - Path=/api/v1/deliveries/**, /api/v1/delivery-routes/**
    loadbalancer:
      cache:
        ttl: ${LB_CACHE_TTL:5s}   # 기본 35s. 새로 뜬 서비스를 빨리 찾도록 줄임 (GW-02)

server:
  port: 19090

# 운영 확인 (GW-11). actuator는 관리 포트에만 둔다. Compose에서 이 포트를 publish하지 않으면 외부에서 닿지 않는다
# - 서비스 포트(19090): 헬스체크용 /livez·/readyz만. /actuator/**는 404
# - 관리 포트(19190): 헬스 상세(Redis·Eureka), 라우트 목록. 설정·메모리(env, heapdump 등)는 노출하지 않는다
management:
  server:
    port: ${GW_MANAGEMENT_PORT:19190}   # 19091은 company-ms 서버 포트라 로컬에서 함께 못 띄움
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true
        add-additional-paths: true   # 서비스 포트에 /livez·/readyz
      group:
        # Redis가 죽어도 재시작하거나 트래픽을 끊지 않는다. 공개 경로·라우팅은 동작하고, 보호 경로만 GW-07이 503으로 응답한다
        liveness:
          include: livenessState
          show-components: never
        readiness:
          include: readinessState
          show-components: never
    gateway:
      access: read-only   # 라우트 조회만. refresh 등 변경 요청은 막는다

jwt:
  secret-key: ${JWT_SECRET_KEY}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: ${EUREKA_FETCH_INTERVAL:5}   # 기본 30초 (GW-02)
  instance:
    prefer-ip-address: true

# 경로 정책 (docs/plan/gateway/GW-03, GW-05, GW-06). 경로가 바뀌면 이 목록만 고친다.
# 규칙 형식: "메서드[,메서드] 경로". 경로의 * = 세그먼트 하나, ** = 마지막에서 0개 이상. 메서드 * = 전체.
# master를 고치면 테스트 정책표(src/test/resources/policy/master-cases.csv)도 함께 고친다.
gateway:
  policy:
    # 외부에서 도달하면 안 되는 경로 (404)
    blocked:
      - /internal/**
      - /api/v1/internal/**
    # 토큰 없이 통과 (04 API 명세서 Auth '비회원')
    public:
      - "POST /api/v1/auth/signup"
      - "POST /api/v1/auth/login"
      - "POST /api/v1/auth/reissue"
      - "GET /api/v1/auth/check-username"
    # 본인 경로는 MASTER 규칙보다 먼저 제외한다 (/users/me가 /users/*에 걸리지 않게)
    master-exclude:
      - "* /api/v1/users/me"
      - "* /api/v1/users/me/**"
    # MASTER만 호출 (403 ACCESS_DENIED). 업체관리자·허브담당처럼 데이터를 봐야 아는 권한은 서비스가 판단한다
    master:
      - "POST,GET /api/v1/users"
      - "GET,PATCH,DELETE /api/v1/users/*"
      - "PATCH /api/v1/users/*/role"
      - "PATCH /api/v1/users/*/delivery-manager"
      - "PATCH /api/v1/users/*/organization"
      - "POST /api/v1/users/*/restore"
      - "POST /api/v1/users/*/password-reset"
      - "PATCH /api/v1/hubs/*"
      - "POST /api/v1/hub-routes"
      - "PATCH,DELETE /api/v1/hub-routes/*"
      - "POST /api/v1/companies"
      - "DELETE /api/v1/companies/*"
      - "PATCH /api/v1/deliveries/*/manager"
    # 관리자가 비밀번호를 정한 사용자(사용자 생성·비밀번호 초기화, 토큰 pcr=true)가 호출할 수 있는 요청 (GW-07). 그 밖은 403 PASSWORD_CHANGE_REQUIRED
    password-change-allowed:
      - "GET /api/v1/users/me"
      - "PATCH /api/v1/users/me/password"
      - "POST /api/v1/auth/logout"
