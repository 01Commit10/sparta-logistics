plugins {
    id 'java-library'
    id 'java-test-fixtures' // 테스트 전용 리소스
}

dependencies {
    compileOnly 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.springframework.boot:spring-boot-starter-data-jpa'
    compileOnly 'org.springframework.boot:spring-boot-starter-validation'
    compileOnly 'org.springframework.cloud:spring-cloud-starter-openfeign'
    compileOnly 'org.springframework.boot:spring-boot-starter-actuator'
    compileOnly 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

    // 레디스
    compileOnly 'org.springframework.boot:spring-boot-starter-data-redis'
    compileOnly 'org.springframework.boot:spring-boot-starter-cache'

    // 전역 예외처리 검증용 (도메인 서비스와 같은 servlet + validation 환경)
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation'

    // Redis 직렬화 검증용
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis'
    testImplementation 'org.springframework.boot:spring-boot-starter-cache'

    // BaseEntity·JPA Auditing 검증용
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testRuntimeOnly 'com.h2database:h2'
}

// 도메인 서비스(Spring Boot 플러그인 적용)와 동일하게 파라미터 이름을 보존.
tasks.named('compileTestJava') {
    options.compilerArgs << '-parameters'
}