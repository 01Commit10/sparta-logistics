spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    username: ${db.username}
    password: ${db.password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        default_schema: ${db.schema}
  data:
    # 목록 조회 (07 서비스 정책 1.5). page는 0부터, size 미지정 시 10.
    # 사이즈 범위는 1~100으로 범위 외의 값은 PagePolicy에서 default 값으로 처리.
    web:
      pageable:
        default-page-size: 10
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cache:
    type: redis
  # 서비스 간 Feign 호출 타임아웃 (C02, SYS-13 3장). Feign을 쓰는 서비스만 적용된다 (openfeign 의존성).
  # Circuit Breaker·재시도는 쓰지 않는다 (C03)
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT:1000}
            read-timeout: ${FEIGN_READ_TIMEOUT:2000}

# Slack 알림 (NTF). Servlet 서비스에서 SlackNotifier 빈으로 쓴다
common:
  notification:
    slack:
      webhook-url: ${SLACK_WEBHOOK_URL:}            # 비어 있으면 알림 끔(NoOp). 비밀값이라 .env에만 둔다
      connect-timeout: ${SLACK_CONNECT_TIMEOUT:1s}
      read-timeout: ${SLACK_READ_TIMEOUT:2s}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info