spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    username: ${db.username}
    password: ${db.password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        default_schema: ${db.schema}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cache:
    type: redis
  # 서비스 간 Feign 호출 (C02, SYS-13 3·4장). Feign을 쓰는 서비스만 적용된다 (openfeign + circuitbreaker-resilience4j 의존성)
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT:1000}
            read-timeout: ${FEIGN_READ_TIMEOUT:2000}
      circuitbreaker:
        enabled: true             # CB는 메서드 단위, 이름은 영숫자만 (예: HubClient#decrease(Req) → HubClientdecreaseReq, C02 E1)
    circuitbreaker:
      resilience4j:
        # 호출한 스레드에서 그대로 실행한다 (C02 E2). TimeLimiter가 적용되지 않아 타임아웃은 위 Feign 값 하나뿐이고,
        # 요청 컨텍스트(사용자 헤더 전달)·트랜잭션·MDC가 유지된다
        disable-thread-pool: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: ${CB_WAIT_IN_OPEN:10s}
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - com.common.remote.RemoteBusinessException   # 4xx 업무 거절은 장애가 아니므로 실패로 세지 않는다

management:
  endpoints:
    web:
      exposure:
        include: health, info, circuitbreakers, circuitbreakerevents