description = 'user-ms'

dependencies {
    // JWT
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // 비밀번호 해시(BCrypt)만 사용. Spring Security 필터 체인은 쓰지 않음 (인증은 Gateway)
    implementation 'org.springframework.security:spring-security-crypto'
    // 토큰 상태 저장 (Refresh Token, 로그아웃·무효화) — docs/plan/02 인증 계약 2.2
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}

tasks.named('test') {
    useJUnitPlatform {
        // Docker가 필요한 테스트는 -PincludeContainer 일 때만 실행
        if (!project.hasProperty('includeContainer')) {
            excludeTags 'container'
        }
    }
}
