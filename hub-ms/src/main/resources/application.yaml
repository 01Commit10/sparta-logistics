spring:
  application:
    name: hub-ms
  profiles:
    include: common

  jpa:
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      data-locations:
        - classpath:db/seed/hubs.sql

server:
  port: 19093

db:
  schema: hub
  username: ${HUB_DB_USER}
  password: ${HUB_DB_PASSWORD}