services:
  postgres:
    image: postgres:18
    container_name: sparta-logistics-postgres
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: Asia/Seoul
      # init 스크립트(01-init-service-accounts.sh)에서 사용
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      HUB_DB_USER: ${HUB_DB_USER}
      HUB_DB_PASSWORD: ${HUB_DB_PASSWORD}
      COMPANY_DB_USER: ${COMPANY_DB_USER}
      COMPANY_DB_PASSWORD: ${COMPANY_DB_PASSWORD}
      ORDER_DB_USER: ${ORDER_DB_USER}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
      DELIVERY_DB_USER: ${DELIVERY_DB_USER}
      DELIVERY_DB_PASSWORD: ${DELIVERY_DB_PASSWORD}
    volumes:
      # 로컬의 pgdata 폴더와 도커 내부 데이터를 동기화 (영구 저장)
      - ./pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: sparta-logistics-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      TZ: Asia/Seoul
      REDISCLI_AUTH: ${REDIS_PASSWORD}  # healthcheck의 redis-cli 인증용
    # appendfsync always: hub-ms Redis 재고 모드가 시작할 때 검사한다 (응답 전에 디스크 기록, 유실 방지)
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD를 .env에 설정해주세요} --appendonly yes --appendfsync always
    volumes:
      # 로컬의 redisdata 폴더와 도커 내부 데이터를 동기화 (AOF 영구 저장)
      - ./redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
